<fieldset class="cbi-section">
	<style>
	#gmr_title.gmr-shine { color: #333; }
	@supports ((-webkit-background-clip: text) or (background-clip: text)) {
		#gmr_title.gmr-shine {
			background-image: linear-gradient(90deg,#ff4d4d,#ffb84d,#ffe14d,#4dff88,#4dd2ff,#b84dff,#ff4d4d);
			background-size: 400% 100%;
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
			color: transparent;
			filter: drop-shadow(0 0 3px rgba(255,255,255,.45));
			animation: gmr-shine 6s linear infinite;
		}
	}
	@keyframes gmr-shine {
		0% { background-position: 0% 50%; }
		100% { background-position: 400% 50%; }
	}
	</style>
	<p style="margin:0 0 6px 0;font-size:13px;line-height:1.6;">
		<span id="gmr_state" style="font-weight:bold;color:#888;">● 正在检测服务状态…</span>
	</p>

	<div id="gmr_card" style="border:1px solid #e3e3e3;border-radius:8px;padding:12px;background:#fff;margin-top:8px;">
		<div style="display:flex;gap:16px;align-items:flex-start;">
			<div id="gmr_cover" style="width:240px;height:240px;border-radius:8px;background:#f2f2f2;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;cursor:zoom-in;" title="点击查看大图">
				<img id="gmr_art" alt="" src="" style="width:100%;height:100%;object-fit:cover;display:none;" />
				<span id="gmr_art_ph" style="color:#bbb;font-size:48px;">🎵</span>
			</div>
			<div style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:240px;">
				<div id="gmr_title" class="gmr-shine" style="font-size:18px;line-height:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">暂无播放</div>
				<div id="gmr_meta" style="font-size:13px;line-height:20px;color:#666;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">演唱者：—</div>
				<div id="gmr_album" style="font-size:13px;line-height:20px;color:#666;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">专辑：—</div>
				<div id="gmr_extra2" style="font-size:12px;line-height:18px;color:#888;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;"></div>

				<div style="margin-top:auto;margin-bottom:20px;">
					<input type="range" id="gmr_seek" min="0" max="1000" value="0" style="width:100%;margin:8px 0 4px 0;" />
					<div style="display:flex;align-items:center;gap:8px;">
						<button type="button" class="cbi-button cbi-button-apply" id="gmr_play">▶ 播放</button>
						<button type="button" class="cbi-button" id="gmr_pause">⏸ 暂停</button>
						<span id="gmr_time" style="font-size:12px;color:#888;">00:00 / 00:00</span>
						<span style="flex:1;"></span>
						<span style="font-size:12px;color:#666;">音量</span>
						<input type="range" id="gmr_vol" min="0" max="100" value="0" style="width:90px;" />
						<span id="gmr_vol_val" style="font-size:12px;color:#666;width:38px;text-align:right;">0%</span>
					</div>
					<div style="font-size:12px;line-height:18px;padding-bottom:2px;color:#888;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">歌曲文件地址：<a id="gmr_url" href="#" target="_blank" rel="noopener" style="color:#1a73e8;text-decoration:none;">—</a></div>
					<div id="gmr_task" style="min-height:18px;line-height:18px;font-size:12px;color:#e67e22;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
				</div>
			</div>
		</div>
	</div>

	<div id="gmr_art_modal" style="display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.78);z-index:99999;align-items:center;justify-content:center;cursor:zoom-out;">
		<img id="gmr_art_big" alt="" src="" style="max-width:92vw;max-height:92vh;border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.5);" />
		<span id="gmr_art_close" style="position:absolute;top:10px;right:22px;color:#fff;font-size:30px;line-height:1;cursor:pointer;">×</span>
	</div>
</fieldset>
<script type="text/javascript">//<![CDATA[
(function() {
	var base = '<%=url([[admin]], [[services]], [[gmediarender]])%>';
	var timer = null;
	var nowTimer = null;
	var dur = 0;

	function el(id) { return document.getElementById(id); }

	function render(running, enabled) {
		var e = el('gmr_state');
		if (!e) return;
		var suffix = enabled ? '' : '（开机未启用）';
		if (running) {
			e.style.color = '#0a8f2c';
			e.textContent = '● 服务状态：正在运行' + suffix;
		} else {
			e.style.color = '#d9534f';
			e.textContent = '● 服务状态：已停止' + suffix;
		}
	}

	function toSec(t) {
		if (!t) return 0;
		var p = String(t).split(':');
		if (p.length === 3) return (+p[0]) * 3600 + (+p[1]) * 60 + (+p[2]);
		if (p.length === 2) return (+p[0]) * 60 + (+p[1]);
		return parseInt(t, 10) || 0;
	}
	function fmt(sec) {
		sec = Math.max(0, Math.floor(sec || 0));
		var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
		var mm = (m < 10 ? '0' : '') + m, ss = (s < 10 ? '0' : '') + s;
		return h > 0 ? (h + ':' + mm + ':' + ss) : (mm + ':' + ss);
	}
	function fmtHMS(sec) {
		sec = Math.max(0, Math.floor(sec || 0));
		var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
		return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
	}

	function paintTask(d) {
		var task = el('gmr_task');
		if (!task) return;
		var msg = '', color = '#e67e22';
		if (d.dl_state === 'downloading') {
			msg = '⏬ 正在下载歌曲：' + (d.dl_file || '');
		} else if (d.dl_state === 'embedding') {
			msg = '🖼 正在嵌入封面：' + (d.dl_file || '');
		} else if (d.dl_result === 'skip') {
			msg = '⏭ 同名文件已内置相同大小封面，已跳过：' + (d.dl_result_file || '');
			color = '#888';
		} else if (d.dl_result === 'done') {
			msg = '✅ 已下载歌曲文件并嵌入封面，保存至 ' + (d.dl_result_file || '');
			color = '#0a8f2c';
		} else if (d.dl_result === 'nofmt') {
			msg = 'ℹ 已下载歌曲文件（该格式不支持嵌入封面），保存至 ' + (d.dl_result_file || '');
			color = '#888';
		} else if (d.dl_result === 'fail') {
			msg = '⚠ 下载或嵌入失败：' + (d.dl_result_file || '');
			color = '#d9534f';
		}
		task.textContent = msg;
		task.style.color = color;
	}

	function toKbps(v) {
		v = parseInt(v, 10) || 0;
		if (v <= 0) return '';
		if (v >= 8000) return Math.round(v * 8 / 1000) + ' kbps';  // DLNA 的 bitrate 通常是字节/秒
		return v + ' kbps';
	}
	function toKHz(v) {
		v = parseInt(v, 10) || 0;
		if (v <= 0) return '';
		var k = v / 1000;
		return (k % 1 === 0 ? k : k.toFixed(1)) + ' kHz';
	}

	function paintNow(d) {
		if (!d) return;
		var title = el('gmr_title'), meta = el('gmr_meta'), album = el('gmr_album');
		var art = el('gmr_art'), ph = el('gmr_art_ph');
		var seek = el('gmr_seek'), tim = el('gmr_time');
		var vol = el('gmr_vol'), volv = el('gmr_vol_val');
		var url = el('gmr_url');
		if (!title) return;

		title.textContent = d.title || '暂无播放';
		meta.textContent = '演唱者：' + (d.artist || '—');
		if (album) album.textContent = '专辑：' + (d.album || '—');

		var ex2 = el('gmr_extra2');
		if (ex2) {
			var parts = [];
			if (d.genre) parts.push('流派：' + d.genre);
			if (d.year) parts.push('年份：' + d.year);
			var br = toKbps(d.bitrate); if (br) parts.push('码率：' + br);
			var sr = toKHz(d.samplerate); if (sr) parts.push('采样率：' + sr);
			if (d.channels) parts.push('声道：' + d.channels);
			if (parts.length) {
				ex2.style.display = 'block';
				ex2.textContent = parts.join('　');
			} else {
				ex2.style.display = 'none';
				ex2.textContent = '';
			}
		}

		if (url) {
			if (d.streamurl) {
				url.textContent = d.streamurl;
				url.title = d.streamurl;
				if (/^https?:\/\//i.test(d.streamurl)) {
					url.href = d.streamurl;
				} else {
					url.removeAttribute('href');
				}
			} else {
				url.textContent = '—';
				url.removeAttribute('href');
				url.removeAttribute('title');
			}
		}

		paintTask(d);

		if (d.albumart) {
			art.onerror = function() { art.style.display = 'none'; ph.style.display = 'block'; };
			if (art.src !== d.albumart) art.src = d.albumart;
			art.style.display = 'block';
			ph.style.display = 'none';
		} else {
			art.style.display = 'none';
			ph.style.display = 'block';
		}
		var cv = el('gmr_cover');
		if (cv) cv.style.cursor = (art.style.display === 'block' && art.src) ? 'zoom-in' : 'default';

		var pos = toSec(d.position);
		dur = toSec(d.duration);
		if (document.activeElement !== seek) {
			seek.value = dur > 0 ? Math.round(pos / dur * 1000) : 0;
		}
		tim.textContent = fmt(pos) + ' / ' + fmt(dur);

		var v = parseInt(d.volume, 10);
		if (isNaN(v)) v = 0;
		if (document.activeElement !== vol) {
			vol.value = v;
		}
		volv.textContent = vol.value + '%';
	}

	function refreshStatus() {
		var x = new XMLHttpRequest();
		x.open('GET', base + '/status?_=' + Date.now(), true);
		x.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
		x.onreadystatechange = function() {
			if (x.readyState !== 4) return;
			if (x.status === 200) {
				try { var d = JSON.parse(x.responseText); render(!!d.running, !!d.enabled); }
				catch (e) { render(false, false); }
			} else {
				render(false, false);
			}
		};
		x.send();
	}

	function refreshNow() {
		var x = new XMLHttpRequest();
		x.open('GET', base + '/nowplaying?_=' + Date.now(), true);
		x.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
		x.onreadystatechange = function() {
			if (x.readyState !== 4) return;
			if (x.status === 200) {
				try { paintNow(JSON.parse(x.responseText)); } catch (e) {}
			}
		};
		x.send();
	}

	function ctl(action, value) {
		var body = 'action=' + encodeURIComponent(action);
		if (value !== undefined && value !== null) body += '&value=' + encodeURIComponent(value);
		var x = new XMLHttpRequest();
		x.open('POST', base + '/control', true);
		x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
		x.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
		x.onreadystatechange = function() {
			if (x.readyState === 4) setTimeout(function() { refreshNow(); refreshStatus(); }, 500);
		};
		x.send(body);
	}

	var playBtn = el('gmr_play'), pauseBtn = el('gmr_pause');
	if (playBtn) playBtn.onclick = function() { ctl('play'); };
	if (pauseBtn) pauseBtn.onclick = function() { ctl('pause'); };

	var seek = el('gmr_seek');
	if (seek) seek.onchange = function() {
		var target = dur > 0 ? Math.floor(dur * seek.value / 1000) : 0;
		ctl('seek', fmtHMS(target));
	};

	var vol = el('gmr_vol');
	if (vol) {
		vol.oninput = function() { var v = el('gmr_vol_val'); if (v) v.textContent = vol.value + '%'; };
		vol.onchange = function() { ctl('volume', vol.value); };
	}

	refreshStatus();
	refreshNow();

	// 点击封面弹窗看大图
	var cover = el('gmr_cover'), modal = el('gmr_art_modal'), big = el('gmr_art_big');
	function closeArt() { if (modal) modal.style.display = 'none'; }
	if (cover) cover.onclick = function() {
		var art = el('gmr_art');
		if (!art || art.style.display === 'none' || !art.src) return;
		if (big) big.src = art.src;
		if (modal) modal.style.display = 'flex';
	};
	if (modal) modal.onclick = function(e) {
		if (e.target === modal || (e.target && e.target.id === 'gmr_art_close')) closeArt();
	};
	document.addEventListener('keydown', function(e) {
		if (e.key === 'Escape') closeArt();
	});

	function startPolling() {
		if (!timer) timer = setInterval(refreshStatus, 3000);
		if (!nowTimer) nowTimer = setInterval(refreshNow, 3000);
	}
	function stopPolling() {
		if (timer) { clearInterval(timer); timer = null; }
		if (nowTimer) { clearInterval(nowTimer); nowTimer = null; }
	}

	// 页面切到后台时停止轮询，回来再继续，减少路由器无谓请求
	document.addEventListener('visibilitychange', function() {
		if (document.hidden) {
			stopPolling();
		} else {
			refreshStatus();
			refreshNow();
			startPolling();
		}
	});
	startPolling();
})();
//]]></script>
