<%+header%>
<h2><%:正在播放%></h2>
<%+gmediarender/status%>

<script type="text/javascript">
(function () {
    var npUrl = '<%=luci.dispatcher.build_url("admin/services/gmediarender/nowplaying")%>';
    var lyUrl = '<%=luci.dispatcher.build_url("admin/services/gmediarender/lyric_state")%>';

    function slot() {
        var el = document.getElementById('gmr_lyric');
        if (el) return el;
        var task = document.getElementById('gmr_task');
        if (!task) return null;
        el = document.createElement('div');
        el.id = 'gmr_lyric';
        el.style.cssText = 'min-height:18px;line-height:18px;font-size:12px;color:#e67e22;' +
                           'margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;';
        task.insertAdjacentElement('afterend', el);
        return el;
    }

    function setLine(txt, color) {
        var el = slot();
        if (!el) return;
        if (!txt) { el.style.display = 'none'; return; }
        el.style.display = '';
        el.textContent = txt;
        el.style.color = color || '#e67e22';
    }

    function tick() {
        fetch(npUrl + '?_=' + Date.now(), { credentials: 'same-origin', cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                var title = (d && d.title) ? String(d.title) : '';
                var artist = (d && d.artist) ? String(d.artist) : '';
                if (!title) { setLine('', '#888'); return; }
                return fetch(lyUrl + '?title=' + encodeURIComponent(title) + '&artist=' + encodeURIComponent(artist) + '&_=' + Date.now(),
                             { credentials: 'same-origin', cache: 'no-store' })
                    .then(function (r) { return r.json(); })
                    .then(function (s) { setLine(s.text, s.color); });
            })
            .catch(function () {});
    }

    tick();
    setInterval(tick, 4000);
})();
</script>

<%+footer%>
